<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>수의산과 3D: 태위·태향·태세 표준 학습 툴</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; height: 100dvh; overflow: hidden; background: #070b14; color: #eee; }
    #canvas-container { flex: 1; position: relative; height: 100%; width: 100%; touch-action: none; }
    #loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #070b14; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; gap: 14px; }
    .spinner { width: 44px; height: 44px; border: 4px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #sidebar {
      width: 450px; background: #111827; padding: 20px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 14px;
      box-shadow: -4px 0 25px rgba(0,0,0,0.7); border-left: 1px solid #1f2937;
      z-index: 20; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sheet-handle { 
      display: none; 
      width: 100%; 
      height: 56px; 
      flex-direction: column;
      justify-content: center; 
      align-items: center; 
      cursor: pointer;
      position: sticky;
      top: 0;
      background: #1e293b; 
      border-bottom: 1px solid #334155;
      z-index: 30;
      gap: 5px;
      user-select: none;
      margin: 0 -18px; 
      padding: 0 18px;
    }
    .sheet-handle-bar { 
      width: 44px; 
      height: 4px; 
      background: #64748b; 
      border-radius: 2px; 
    }
    .sheet-handle-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sheet-handle-icon {
      font-size: 0.85rem;
      color: #818cf8;
      transition: transform 0.2s ease;
    }

    h2 { font-size: 1.15rem; border-bottom: 2px solid #6366f1; padding-bottom: 8px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.82rem; font-weight: bold; color: #94a3b8; }
    select { background: #1f2937; color: #fff; border: 1px solid #374151; padding: 10px; border-radius: 8px; font-size: 0.86rem; outline: none; }
    select:focus { border-color: #818cf8; }

    .mode-toggle { display: flex; gap: 6px; background: #0b0f19; padding: 4px; border-radius: 8px; border: 1px solid #374151; }
    .mode-btn { flex: 1; padding: 8px 6px; border: none; border-radius: 6px; font-size: 0.8rem; font-weight: bold; background: transparent; color: #94a3b8; cursor: pointer; transition: all 0.2s; }
    .mode-btn.active { background: #6366f1; color: #fff; box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4); }

    .slider-container { display: flex; align-items: center; gap: 10px; }
    .slider-container input { flex: 1; accent-color: #6366f1; }
    .slider-val { font-size: 0.8rem; width: 35px; color: #a5b4fc; }

    .info-card { background: #0b0f19; border-left: 4px solid #6366f1; padding: 14px; border-radius: 8px; border: 1px solid #1e293b; border-left-width: 4px; display: flex; flex-direction: column; gap: 8px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .info-card h3 { font-size: 1.05rem; color: #a5b4fc; }
    .badge-group { display: flex; gap: 5px; }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 0.72rem; font-weight: bold; }
    .badge-normal { background: #065f46; color: #34d399; }
    .badge-abnormal { background: #7f1d1d; color: #f87171; }
    .badge-mode { background: #312e81; color: #c7d2fe; border: 1px solid #4338ca; }

    .info-row { font-size: 0.83rem; line-height: 1.45; color: #cbd5e1; }
    .info-row strong { color: #94a3b8; margin-right: 4px; display: inline-block; min-width: 78px; }
    
    .clinical-box { 
      margin-top: 6px; 
      padding: 10px; 
      background: #111c33; 
      border-radius: 6px; 
      border: 1px solid #1e3a8a; 
      font-size: 0.8rem; 
      line-height: 1.5; 
    }
    .clinical-box h4 { font-size: 0.82rem; color: #93c5fd; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
    .clinical-box p { color: #cbd5e1; margin: 0; }

    .view-btns { display: flex; gap: 6px; }
    .view-btns button { flex: 1; background: #1f2937; border: 1px solid #374151; color: #e2e8f0; padding: 8px 4px; border-radius: 6px; cursor: pointer; font-size: 0.78rem; }
    .view-btns button:active { background: #4f46e5; }

    .legend-box { background: #0b0f19; border-radius: 8px; padding: 10px; font-size: 0.75rem; color: #94a3b8; display: flex; flex-direction: column; gap: 5px; border: 1px solid #1e293b; }
    .color-chip { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      #sidebar {
        position: absolute; 
        bottom: 0; 
        left: 0; 
        width: 100%; 
        max-height: 82vh;
        border-left: none; 
        border-top: 2px solid #6366f1; 
        border-radius: 18px 18px 0 0;
        padding: 0 18px 24px 18px;
        transform: translateY(calc(100% - 56px));
        background: #111827;
      }
      #sidebar.expanded { 
        transform: translateY(0); 
      }
      .sheet-handle { 
        display: flex; 
      }
      h2 { font-size: 1.05rem; margin-top: 14px; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="canvas-container">
    <div id="loading-screen">
      <div class="spinner"></div>
      <p id="loading-msg" style="color: #94a3b8; font-size: 0.95rem;">3D 모델 로딩 중...</p>
    </div>
  </div>

  <div id="sidebar">
    <div class="sheet-handle" id="sheetHandle">
      <div class="sheet-handle-bar"></div>
      <div class="sheet-handle-text">
        <span class="sheet-handle-icon" id="sheetIcon">▲</span>
        <span id="sheetLabel">자세 선택</span>
      </div>
    </div>

    <h2>
      <span>수의산과 3D 시각화</span>
      <span id="current-mode-label" style="font-size: 0.75rem; color: #818cf8; font-weight: normal;">표 7-3 한정 모드</span>
    </h2>

    <div class="control-group">
      <label>동작 모드 선택</label>
      <div class="mode-toggle">
        <button type="button" id="btnModeTable" class="mode-btn active">표 7-3 한정</button>
        <button type="button" id="btnModeFree" class="mode-btn">자유 조합 (산과 정밀)</button>
      </div>
    </div>

    <div class="control-group">
      <label for="presentation">1. 태위 (Presentation)</label>
      <select id="presentation"></select>
    </div>

    <div class="control-group">
      <label for="position">2. 태향 (Position)</label>
      <select id="position"></select>
    </div>

    <div class="control-group">
      <label for="posture">3. 태아의 자세 (태세 / Posture)</label>
      <select id="posture"></select>
    </div>

    <div class="control-group">
      <label for="damOpacity">어미소 외피 투명도 조절</label>
      <div class="slider-container">
        <input type="range" id="damOpacity" min="0.0" max="0.9" step="0.05" value="0.28">
        <span id="opacityVal" class="slider-val">28%</span>
      </div>
    </div>

    <div class="control-group">
      <label>관찰 시점 프리셋 (태아 기준)</label>
      <div class="view-btns">
        <button onclick="setView(0, 0.4, 3.2)">산도 직후방 (외음부 뷰)</button>
        <button onclick="setView(3.8, 0.3, 0)">우측면 투시</button>
        <button onclick="setView(0, 4.2, 0.1)">상단 천골면</button>
      </div>
    </div>

    <div class="info-card">
      <div class="card-header">
        <h3 id="info-status">구분</h3>
        <div class="badge-group">
          <span id="info-mode-badge" class="badge badge-mode">표 7-3</span>
          <span id="info-main-badge" class="badge"></span>
        </div>
      </div>
      <div class="info-row" id="row-alias-box">
        <strong>일반명(구용어):</strong>
        <span id="info-alias">-</span>
      </div>
      <div class="info-row" id="row-pres-box" style="display: none;">
        <strong>태위 구분:</strong>
        <span id="info-pres-text">-</span>
      </div>
      <div class="info-row" id="row-pos-box" style="display: none;">
        <strong>태향 구분:</strong>
        <span id="info-pos-text">-</span>
      </div>
      <div class="info-row">
        <strong>태세(자세):</strong>
        <span id="info-posture-desc">-</span>
      </div>
      
      <div id="clinical-box" class="clinical-box" style="display: none;">
        <h4 id="clinical-title">산과적 처치 지침</h4>
        <p id="clinical-desc"></p>
      </div>
    </div>

    <div class="legend-box">
      <div><span class="color-chip" style="background:#ef4444;"></span><b>적색 링</b>: 어미소 골반강 입구 (Pelvic brim)</div>
      <div><span class="color-chip" style="background:#8c5230;"></span><b>갈색 두부</b>: 송아지 머리 (자른 원뿔, 눈·코·입)</div>
      <div><span class="color-chip" style="background:#cbd5e1;"></span><b>반투명 체간</b>: 송아지 몸통 (투명도 70%)</div>
      <div><span class="color-chip" style="background:#f97316;"></span><b>주황색 구</b>: 앞무릎(완관절) / 뒷발목(비절)</div>
      <div><span class="color-chip" style="background:#10b981;"></span><b>녹색 블록</b>: 송아지 발굽(구절 말단)</div>
    </div>
  </div>

  <script>
    const FETUS_POS = { x: 0, y: 3.7, z: 2.8 };

    // --- 1. Three.js 기본 세팅 ---
    const container = document.getElementById('canvas-container');
    const loadingScreen = document.getElementById('loading-screen');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(FETUS_POS.x + 2.5, FETUS_POS.y + 1.2, FETUS_POS.z + 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(FETUS_POS.x, FETUS_POS.y, FETUS_POS.z);

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(6, 12, 8);
    scene.add(dirLight);
    const backLight = new THREE.DirectionalLight(0x818cf8, 0.5);
    backLight.position.set(-6, 4, -6);
    scene.add(backLight);

    const grid = new THREE.GridHelper(14, 28, 0x1e293b, 0x0f172a);
    grid.position.y = 0;
    scene.add(grid);

    const worldCenter = new THREE.Group();
    scene.add(worldCenter);

    // --- 2. 골반강 입구 림 및 천골 마커 ---
    const pelvicRim = new THREE.Mesh(
      new THREE.TorusGeometry(0.55, 0.05, 16, 48),
      new THREE.MeshBasicMaterial({ color: 0xef4444 })
    );
    pelvicRim.position.set(0, 3.5, 4.50);
    worldCenter.add(pelvicRim);

    const sacrumMarker = new THREE.Mesh(
      new THREE.BoxGeometry(0.35, 0.08, 0.08),
      new THREE.MeshBasicMaterial({ color: 0xf87171 })
    );
    sacrumMarker.position.set(0, 4.08, 4.50);
    worldCenter.add(sacrumMarker);

    // --- 3. 외부 GLB 모델 로더 ---
    const importedMaterials = [];
    const gltfLoader = new THREE.GLTFLoader();

    gltfLoader.load(
      'models/cow.glb',
      function (gltf) {
        const cowMesh = gltf.scene;
        const box = new THREE.Box3().setFromObject(cowMesh);
        const size = new THREE.Vector3();
        box.getSize(size);
        const center = new THREE.Vector3();
        box.getCenter(center);

        const targetScale = 9 / size.z;
        cowMesh.scale.setScalar(targetScale);

        cowMesh.rotation.y = Math.PI;
        cowMesh.position.x = center.x * targetScale;
        cowMesh.position.y = -box.min.y * targetScale;
        cowMesh.position.z = center.z * targetScale + 0.4;

        cowMesh.traverse((child) => {
          if (child.isMesh) {
            const transMat = new THREE.MeshStandardMaterial({
              color: 0x64748b,
              roughness: 0.35,
              metalness: 0.1,
              transparent: true,
              opacity: 0.28,
              depthWrite: false,
              side: THREE.DoubleSide
            });
            child.material = transMat;
            importedMaterials.push(transMat);
          }
        });

        worldCenter.add(cowMesh);
        loadingScreen.style.display = 'none';
      },
      undefined,
      function (err) {
        console.warn('models/cow.glb 로드 오류:', err);
        loadingScreen.style.display = 'none';
      }
    );

    // --- 4. 정밀 송아지 모델 (3단 앞다리 관절 & 갈색 절두체 머리) ---
    const fetusCenter = new THREE.Group();
    fetusCenter.position.set(FETUS_POS.x, FETUS_POS.y, FETUS_POS.z);
    worldCenter.add(fetusCenter);

    const fRoot = new THREE.Group();
    fetusCenter.add(fRoot);

    const calfBodyMat = new THREE.MeshStandardMaterial({
      color: 0xe2e8f0,
      roughness: 0.5,
      transparent: true,
      opacity: 0.70
    });
    const calfHeadMat = new THREE.MeshStandardMaterial({ color: 0x8c5230, roughness: 0.6 });
    const calfFaceMat = new THREE.MeshBasicMaterial({ color: 0x18181b });
    const calfSpineMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
    const legBoneMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1 });
    const elbowMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
    const jointMat = new THREE.MeshStandardMaterial({ color: 0xf97316 });
    const hoofMat = new THREE.MeshStandardMaterial({ color: 0x10b981 });

    const fBody = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.29, 1.25, 14), calfBodyMat);
    fBody.rotation.x = Math.PI / 2;
    fRoot.add(fBody);

    const fSpine = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 1.2), calfSpineMat);
    fSpine.position.set(0, 0.32, 0);
    fRoot.add(fSpine);

    const neckPivot = new THREE.Group();
    neckPivot.position.set(0, 0.1, 0.6);
    fRoot.add(neckPivot);

    const fHead = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.22, 0.55, 16), calfHeadMat);
    fHead.rotation.x = Math.PI / 2;
    fHead.position.set(0, 0, 0.28);
    neckPivot.add(fHead);

    const fNose = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.06, 0.04), calfFaceMat);
    fNose.position.set(0, 0.02, 0.56);
    neckPivot.add(fNose);

    const fMouth = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.02, 0.03), calfFaceMat);
    fMouth.position.set(0, -0.04, 0.55);
    neckPivot.add(fMouth);

    const eyeGeo = new THREE.SphereGeometry(0.035, 8, 8);
    const eyeLeft = new THREE.Mesh(eyeGeo, calfFaceMat);
    eyeLeft.position.set(0.14, 0.08, 0.32);
    neckPivot.add(eyeLeft);

    const eyeRight = new THREE.Mesh(eyeGeo, calfFaceMat);
    eyeRight.position.set(-0.14, 0.08, 0.32);
    neckPivot.add(eyeRight);

    const earGeo = new THREE.ConeGeometry(0.05, 0.16, 6);
    const earLeft = new THREE.Mesh(earGeo, calfHeadMat);
    earLeft.position.set(0.19, 0.12, 0.14);
    earLeft.rotation.set(-0.3, 0, -Math.PI / 2.8);
    neckPivot.add(earLeft);

    const earRight = new THREE.Mesh(earGeo, calfHeadMat);
    earRight.position.set(-0.19, 0.12, 0.14);
    earRight.rotation.set(-0.3, 0, Math.PI / 2.8);
    neckPivot.add(earRight);

    // 해부학적 3단 앞다리 생성 함수
    function buildForeleg(isLeft) {
      const side = isLeft ? 1 : -1;
      const shoulder = new THREE.Group();
      shoulder.position.set(side * 0.24, -0.12, 0.45);
      fRoot.add(shoulder);

      // 상완 (Humerus)
      const humerus = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.05, 0.26), legBoneMat);
      humerus.position.set(0, 0, 0.13);
      humerus.rotation.x = Math.PI / 2;
      shoulder.add(humerus);

      // 주관절 (Elbow / 앞다리굽이)
      const elbow = new THREE.Group();
      elbow.position.set(0, 0, 0.26);
      shoulder.add(elbow);

      const elbowBall = new THREE.Mesh(new THREE.SphereGeometry(0.065, 8, 8), elbowMat);
      elbow.add(elbowBall);

      // 전완 (Radius & Ulna)
      const radius = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.045, 0.26), legBoneMat);
      radius.position.set(0, 0, 0.13);
      radius.rotation.x = Math.PI / 2;
      elbow.add(radius);

      // 완관절 (Carpus / 앞무릎 - 주황색 구)
      const carpus = new THREE.Group();
      carpus.position.set(0, 0, 0.26);
      elbow.add(carpus);

      const kneeBall = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 10), jointMat);
      carpus.add(kneeBall);

      // 중수골 (Cannon / 정강이)
      const metacarpus = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.04, 0.26), legBoneMat);
      metacarpus.position.set(0, 0, 0.13);
      metacarpus.rotation.x = Math.PI / 2;
      carpus.add(metacarpus);

      // 구절 (Fetlock)
      const fetlock = new THREE.Group();
      fetlock.position.set(0, 0, 0.26);
      carpus.add(fetlock);

      // 발굽 (Hoof - 녹색 블록)
      const hoof = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.06, 0.11), hoofMat);
      hoof.position.set(0, -0.02, 0.06);
      fetlock.add(hoof);

      return { shoulder, elbow, carpus, fetlock };
    }

    // 뒷다리 생성 함수
    function buildHindleg(isLeft) {
      const side = isLeft ? 1 : -1;
      const hip = new THREE.Group();
      hip.position.set(side * 0.26, -0.1, -0.48);
      fRoot.add(hip);

      // 대퇴골 (Thigh)
      const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.45), legBoneMat);
      thigh.position.set(0, -0.22, 0);
      hip.add(thigh);

      // 비절 (Hock / 뒷발목 - 주황색 구)
      const hock = new THREE.Group();
      hock.position.set(0, -0.45, 0);
      hip.add(hock);

      const hockBall = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), jointMat);
      hock.add(hockBall);

      // 중척골 (Lower leg)
      const lowerLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.045, 0.52), legBoneMat);
      lowerLeg.position.set(0, 0, -0.26);
      lowerLeg.rotation.x = -Math.PI / 2;
      hock.add(lowerLeg);

      // 발굽 (뒷발바닥 상향 기준)
      const hoof = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.07, 0.11), hoofMat);
      hoof.position.set(0, 0, -0.54);
      hock.add(hoof);

      return { hip, hock };
    }

    const foreLeft = buildForeleg(true);
    const foreRight = buildForeleg(false);
    const hindLeft = buildHindleg(true);
    const hindRight = buildHindleg(false);

    // --- 5. [모드 1: 표 7-3 정식 스키마] ---
    const TABLE_SCHEMA = {
      anterior: {
        name: "세로·머리태위",
        positions: {
          dorsal: {
            name: "위쪽태향",
            postures: {
              normalFore: { status: "정상", postureDesc: "양쪽 앞다리와 머리가 출산길로 펴진 자세", alias: "세로·머리태위 위쪽태향(종위·두위 상태향, 종위·두위 배천골태향)" },
              headLateral: { status: "실위", postureDesc: "옆쪽으로 머리가 꺾인 자세", alias: "옆쪽머리태위(측두위)" },

    btnModeTable.addEventListener('click', () => {

      btnModeFree.classList.remove('active');

    function initModeDropdowns() {
      selPres.innerHTML = "";
      if (currentMode === 'table') {
        for (let pKey in TABLE_SCHEMA) {
          const opt = document.createElement("option");
          opt.value = pKey;
          opt.textContent = TABLE_SCHEMA[pKey].name;
          selPres.appendChild(opt);
        }
        refreshTablePositions();
      } else {
        FREE_PRESENTATIONS.forEach(p => {
          const opt = document.createElement("option");
          opt.value = p.key;
          opt.textContent = p.name;
          selPres.appendChild(opt);
        });
        refreshFreePositions();
      }
    }

    function refreshTablePositions() {
      const presKey = selPres.value;
      const positions = TABLE_SCHEMA[presKey].positions;
      selPos.innerHTML = "";

      for (let key in positions) {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = positions[key].name;
        selPos.appendChild(opt);
      }
      refreshTablePostures();
    }

    function refreshTablePostures() {
      const presKey = selPres.value;
      const posKey = selPos.value;
      const postures = TABLE_SCHEMA[presKey]?.positions[posKey]?.postures || {};
      selPost.innerHTML = "";

      for (let key in postures) {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = postures[key].postureDesc.split('\n')[0];
        selPost.appendChild(opt);
      }
      updateSimulation();
    }

    function refreshFreePositions() {
      const presKey = selPres.value;
      const posList = FREE_POSITIONS_BY_PRES[presKey] || [];
      selPos.innerHTML = "";

      posList.forEach(pos => {
        const opt = document.createElement("option");
        opt.value = pos.key;
        opt.textContent = pos.name;
        selPos.appendChild(opt);
      });
      refreshFreePostures();
    }

    function refreshFreePostures() {
      selPost.innerHTML = "";
      FREE_POSTURES.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p.key;
        opt.textContent = p.name;
        selPost.appendChild(opt);
      });
      updateSimulation();
    }

    selPres.addEventListener('change', () => {
      if (currentMode === 'table') refreshTablePositions();
      else refreshFreePositions();
    });

    selPos.addEventListener('change', () => {
      if (currentMode === 'table') refreshTablePostures();
      else updateSimulation();
    });

    selPost.addEventListener('change', updateSimulation);

    // --- 8. 기저 벡터 기반 정밀 3D 렌더링 엔진 ---
    const basisX = new THREE.Vector3();
    const basisY = new THREE.Vector3();
    const basisZ = new THREE.Vector3();
    const rotMatrix = new THREE.Matrix4();

    function updateSimulation() {
      const pres = selPres.value;
      const pos = selPos.value;
      const post = selPost.value;

      fRoot.rotation.set(0, 0, 0);

      // [3D 회전 벡터 연산]
      if (currentMode === 'table') {
        if (pres === 'anterior') {
          basisZ.set(0, 0, 1);
          if (pos === 'dorsal') basisY.set(0, 1, 0);
          else if (pos === 'rightLateral') basisY.set(1, 0, 0);
          else if (pos === 'leftLateral') basisY.set(-1, 0, 0);
          else if (pos === 'ventral') basisY.set(0, -1, 0);
        } else if (pres === 'posterior') {
          basisZ.set(0, 0, -1);
          if (pos === 'dorsal') basisY.set(0, 1, 0);
          else if (pos === 'rightLateral') basisY.set(1, 0, 0);
          else if (pos === 'leftLateral') basisY.set(-1, 0, 0);
          else if (pos === 'ventral') basisY.set(0, -1, 0);
        } else if (pres === 'transverse') {
          basisZ.set(1, 0, 0);
          if (post === 'dorsalExit') basisY.set(0, 0, 1);
          else basisY.set(0, 0, -1);
        } else if (pres === 'vertical') {
          basisZ.set(0, 1, 0);
          if (post === 'dorsalExit') basisY.set(0, 0, 1);
          else basisY.set(0, 0, -1);
        }
      } else {
        if (pres === 'ant_long') {
          basisZ.set(0, 0, 1);
          if (pos === 'dorsal') basisY.set(0, 1, 0);
          else if (pos === 'rightLateral') basisY.set(1, 0, 0);
          else if (pos === 'leftLateral') basisY.set(-1, 0, 0);
          else if (pos === 'ventral') basisY.set(0, -1, 0);
        } else if (pres === 'post_long') {
          basisZ.set(0, 0, -1);
          if (pos === 'dorsal') basisY.set(0, 1, 0);
          else if (pos === 'rightLateral') basisY.set(1, 0, 0);
          else if (pos === 'leftLateral') basisY.set(-1, 0, 0);
          else if (pos === 'ventral') basisY.set(0, -1, 0);
        } else if (pres === 'trans_dorsal') {
          basisY.set(0, 0, 1);
          if (pos === 'rightCephalo') basisZ.set(1, 0, 0);
          else basisZ.set(-1, 0, 0);
        } else if (pres === 'trans_ventral') {
          basisY.set(0, 0, -1);
          if (pos === 'rightCephalo') basisZ.set(1, 0, 0);
          else basisZ.set(-1, 0, 0);
        } else if (pres === 'vert_dorsal') {
          basisY.set(0, 0, 1);
          if (pos === 'cephaloUp') basisZ.set(0, 1, 0);
          else basisZ.set(0, -1, 0);
        } else if (pres === 'vert_ventral') {
          basisY.set(0, 0, -1);
          if (pos === 'cephaloUp') basisZ.set(0, 1, 0);
          else basisZ.set(0, -1, 0);
        }
      }

      basisX.crossVectors(basisY, basisZ);
      rotMatrix.makeBasis(basisX, basisY, basisZ);
      fRoot.quaternion.setFromRotationMatrix(rotMatrix);

      // 관절 각도 기본 리셋 (앞다리/뒷다리/두부)
      neckPivot.rotation.set(0, 0, 0);
      foreLeft.shoulder.rotation.set(0, 0, 0);
      foreLeft.elbow.rotation.set(0, 0, 0);
      foreLeft.carpus.rotation.set(0, 0, 0);
      foreLeft.fetlock.rotation.set(0, 0, 0);

      foreRight.shoulder.rotation.set(0, 0, 0);
      foreRight.elbow.rotation.set(0, 0, 0);
      foreRight.carpus.rotation.set(0, 0, 0);
      foreRight.fetlock.rotation.set(0, 0, 0);

      hindLeft.hip.rotation.set(0, 0, 0);
      hindLeft.hock.rotation.set(0, 0, 0);
      hindRight.hip.rotation.set(0, 0, 0);
      hindRight.hock.rotation.set(0, 0, 0);

      // [해부학적 3D 관절 꺾임 매핑]
      switch (post) {
        case 'headLateral':
          neckPivot.rotation.set(0, -Math.PI / 1.8, -0.2); // 우측 흉벽으로 목 굴곡
          break;
        case 'headVertex':
          neckPivot.rotation.x = Math.PI / 2.6; // 정수리 산도 선행
          break;
        case 'headBreast':
          neckPivot.rotation.x = Math.PI / 1.8; // 코/턱이 치골 가장자리 아래로
          break;
        case 'headNape':
          neckPivot.rotation.x = Math.PI / 1.35; // 목덜미 선행 극단 굴곡
          break;
        case 'headDorsal':
          neckPivot.rotation.x = -Math.PI / 2.4; // 등 위로 머리 젖힘
          break;
        case 'elbowFlexion':
          // 주관절굴절위: 어깨 후방 변위 + 팔꿈치 굴곡으로 치골림에 걸림
          foreRight.shoulder.rotation.x = -0.35;
          foreRight.elbow.rotation.x = -Math.PI / 2.6;
          break;
        case 'shoulderFlexion':
          // 견갑골굴절위: 어깨부터 다리 전체가 흉벽 뒤로 젖혀짐
          foreRight.shoulder.rotation.x = -Math.PI / 1.6;
          break;
        case 'carpalFlexion':
          // 완관절굴절위: 팔꿈치는 펴져 앞무릎(주황구)이 림에 진입하나, 완관절이 뒤로 145도 접힘
          foreRight.carpus.rotation.x = -Math.PI / 1.25;
          break;
        case 'fetlockFlexion':
          // 구절굴절위: 완관절까지 전방 신장, 발목(구절)만 꺾여 발등 선행
          foreRight.fetlock.rotation.x = -Math.PI / 1.7;
          break;
        case 'crossLegs':
          // 정상위교차위: 앞다리가 머리 위(등쪽)로 들려 올라가 정수리 위에서 X자 교차
          foreLeft.shoulder.rotation.set(-0.35, 0, -0.45);
          foreRight.shoulder.rotation.set(-0.35, 0, 0.45);
          break;
        case 'dogSitting':
          // 견좌자세: 양 뒷다리가 엉덩이관절부터 개처럼 몸 밑 앞으로 뻗어 나옴
          hindLeft.hip.rotation.x = Math.PI / 1.6;
          hindRight.hip.rotation.x = Math.PI / 1.6;
          hindLeft.hock.rotation.x = -Math.PI / 2.0;
          hindRight.hock.rotation.x = -Math.PI / 2.0;
          break;
        case 'breech':
          // 볼기태위(둔위): 고관절이 굴곡되어 뒷다리가 복벽 밑에 깔림
          hindLeft.hip.rotation.x = Math.PI / 1.6;
          hindRight.hip.rotation.x = Math.PI / 1.6;
          break;
        case 'hockFlexion':
          // 비절굴절위: 비절(주황구)이 림에 진입하고 발목 아래가 전방으로 접힘
          hindRight.hock.rotation.x = Math.PI / 1.35;
          break;
      }

      // --- UI 카드 정보 갱신 ---
      if (currentMode === 'table') {
        const record = TABLE_SCHEMA[pres]?.positions[pos]?.postures[post];
        if (!record) return;

        infoModeBadge.innerText = "표 7-3 수록";
        infoModeBadge.style.background = "#312e81";
        infoStatus.innerText = record.status;
        infoMainBadge.className = record.status === "정상" ? "badge badge-normal" : "badge badge-abnormal";
        infoMainBadge.innerText = record.status;

        rowAliasBox.style.display = "block";
        rowPresBox.style.display = "none";
        rowPosBox.style.display = "none";
        infoAlias.innerText = record.alias;
        infoPostureDesc.innerText = record.postureDesc;
        clinicalBox.style.display = "none";
      } else {
        infoModeBadge.innerText = "산과 정밀 분류";
        infoModeBadge.style.background = "#064e3b";

        const pItem = FREE_PRESENTATIONS.find(x => x.key === pres);
        const posList = FREE_POSITIONS_BY_PRES[pres] || [];
        const posItem = posList.find(x => x.key === pos);
        const postItem = FREE_POSTURES.find(x => x.key === post);

        // 현대 수의산과학 2대 정상 분만(두위 정상 + 미위 정상) 완전 판정
        const isNormalAnterior = (pres === 'ant_long' && pos === 'dorsal' && post === 'extended');
        const isNormalPosterior = (pres === 'post_long' && pos === 'dorsal' && post === 'extended');
        const isNormal = isNormalAnterior || isNormalPosterior;

        infoStatus.innerText = isNormal ? "정상 분만" : "실위 (난산 분만)";
        infoMainBadge.className = isNormal ? "badge badge-normal" : "badge badge-abnormal";
        infoMainBadge.innerText = isNormal ? "정상" : "실위";

        rowAliasBox.style.display = "none";
        rowPresBox.style.display = "block";
        rowPosBox.style.display = "block";

        infoPresText.innerText = pItem ? pItem.name : "-";
        infoPosText.innerText = posItem ? posItem.name : "-";
        infoPostureDesc.innerText = postItem ? `${postItem.name} — ${postItem.desc}` : "-";

        clinicalBox.style.display = "block";

        if (isNormal) {
          if (isNormalAnterior) {
            clinicalTitle.innerText = "생리적 정상 만출 (세로·머리태위, 상태향)";
            clinicalDesc.innerText = "단태 가축(소)의 95% 이상을 차지하는 전형적인 정상 분만입니다. 머리와 앞발바닥이 아래(치골)를 향한 채 자연 만출이 진행됩니다.";
          } else {
            clinicalTitle.innerText = "생리적 정상 만출 (세로·꼬리태위, 상태향)";
            clinicalDesc.innerText = "교재 [표 7-3]에 등재된 정상 분만입니다. 뒷발바닥이 위(천골)를 향한 채 자력 만출이 가능합니다. 단, 흉곽 통과 시 제대(탯줄) 압박에 의한 태아 가사 위험이 있으므로 분만 제2기 진행 속도를 면밀히 모니터링해야 합니다.";
          }
        } else {
          const dystociaReasons = [];
          if (pres.startsWith('trans_') || pres.startsWith('vert_')) {
            dystociaReasons.push("태위 이상(체장이 산도 직경을 초과하여 통과 불가)");
          }

          if (pos !== 'dorsal') {
            dystociaReasons.push("태향 축 회전 실위(태아 등이 골반 천장을 향하지 않음)");
          }

          if (post !== 'extended') {
            dystociaReasons.push(`태세 굴절 이상(${postItem ? postItem.name.split(' ')[0] : '사지 변위'})`);
          }

          clinicalTitle.innerText = `실위 진단: ${dystociaReasons.join(', ')}`;

          if (pres.startsWith('trans_') || pres.startsWith('vert_')) {
            clinicalDesc.innerText = "단순 견인 불가. 태아를 자궁 안쪽으로 밀어 넣는 반발(Repulsion) 후, 머리 또는 뒷다리를 잡아당겨 90도 회전시키는 전환술(Version)로 세로태위로 전환해야 합니다.";
          } else if (post === 'breech') {
            clinicalDesc.innerText = "볼기태위(둔위)는 뒷다리가 복벽 밑에 깔려 있으므로, 자궁 안쪽으로 엉덩이를 반발시키며 뒷발목을 손안에 쥐고 안쪽으로 굴곡시켜 골반강 밖으로 펴내는 족견인 정복술이 필수적입니다.";
          } else if (post === 'carpalFlexion') {
            clinicalDesc.innerText = "앞무릎(완관절)이 먼저 닿아 있는 상태입니다. 무릎을 전상방으로 밀면서 발굽 말단을 손바닥으로 감싸 자궁벽 손상 없이 외음부 쪽으로 펴내는 정복술을 시행합니다.";
          } else if (post === 'elbowFlexion') {
            clinicalDesc.innerText = "팔꿈치(주관절)가 치골 림에 걸려 있습니다. 발을 약간 후방으로 밀면서 다리를 앞쪽으로 들어 올려 주관절을 완전히 신장시킨 후 견인합니다.";
          } else if (post === 'headLateral') {
            clinicalDesc.innerText = "옆으로 꺾인 머리를 산도 바깥으로 당기기 전에 몸체를 후방 반발하고, 눈확이나 하악골을 잡아 턱을 골반 입구 중앙으로 바로잡는 정복술을 시행합니다.";
          } else if (post !== 'extended') {
            clinicalDesc.innerText = "굴곡된 관절을 무리하게 잡아당기면 산도 파열 위험이 있습니다. 관절 상부를 밀어 넣고 발굽 말단을 손바닥으로 감싸 자궁벽 손상 없이 펴내야 합니다.";
          } else if (pos !== 'dorsal') {
            clinicalDesc.innerText = "머리와 다리가 펴져 있어도 태아 몸체가 회전되어 있으므로, 어깨와 골반 축을 모체 천골 방향으로 회전(Rotation)시킨 후 견인해야 합니다.";
          } else {
            clinicalDesc.innerText = "산도 내 윤활제 주입 및 태아 활력 징후(제대 박동)를 모니터링하며 완만한 보조 견인을 실시합니다.";
          }
        }
      }
    }

    initModeDropdowns();

    // 슬라이더
    const opSlider = document.getElementById('damOpacity');
    const opText = document.getElementById('opacityVal');
    opSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      importedMaterials.forEach(m => m.opacity = val);
      opText.innerText = Math.round(val * 100) + '%';
    });

    // 태아 중심 시점 제어
    window.setView = function(offsetX, offsetY, offsetZ) {
      const mult = window.innerWidth <= 768 ? 1.25 : 1.0;
      camera.position.set(
        FETUS_POS.x + offsetX * mult,
        FETUS_POS.y + offsetY * mult,
        FETUS_POS.z + offsetZ * mult
      );
      controls.target.set(FETUS_POS.x, FETUS_POS.y, FETUS_POS.z);
    };

    // 모바일 바텀시트 제어
    const sidebar = document.getElementById('sidebar');
    const sheetHandle = document.getElementById('sheetHandle');
    const sheetIcon = document.getElementById('sheetIcon');
    const sheetLabel = document.getElementById('sheetLabel');

    function toggleBottomSheet() {
      const isExpanded = sidebar.classList.toggle('expanded');
      if (isExpanded) {
        sheetIcon.textContent = '▼';
        sheetLabel.textContent = '메뉴 닫기';
      } else {
        sheetIcon.textContent = '▲';
        sheetLabel.textContent = '자세 선택';
      }
    }

    sheetHandle.addEventListener('click', toggleBottomSheet);

    container.addEventListener('touchstart', () => {
      if (window.innerWidth <= 768 && sidebar.classList.contains('expanded')) {
        sidebar.classList.remove('expanded');
        sheetIcon.textContent = '▲';
        sheetLabel.textContent = '자세 선택';
      }
    }, { passive: true });

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
