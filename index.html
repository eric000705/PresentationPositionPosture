<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>수의산과 3D: 어미소 & 송아지 태세 시각화</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; height: 100dvh; overflow: hidden; background: #070b14; color: #eee; -webkit-tap-highlight-color: transparent; }
    
    #canvas-container { flex: 1; position: relative; height: 100%; width: 100%; touch-action: none; }

    /* 데스크톱 사이드바 기본 */
    #sidebar {
      width: 420px;
      background: #111827;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: -4px 0 25px rgba(0,0,0,0.7);
      border-left: 1px solid #1f2937;
      z-index: 20;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 모바일 바텀시트 토글 핸들 */
    .sheet-handle {
      display: none;
      width: 100%;
      padding: 8px 0 12px 0;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .sheet-handle-bar {
      width: 40px;
      height: 4px;
      background: #475569;
      border-radius: 2px;
    }

    h2 { font-size: 1.2rem; border-bottom: 2px solid #6366f1; padding-bottom: 8px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.82rem; font-weight: bold; color: #94a3b8; }
    select { background: #1f2937; color: #fff; border: 1px solid #374151; padding: 10px; border-radius: 8px; font-size: 0.9rem; outline: none; -webkit-appearance: none; }
    select:focus { border-color: #818cf8; }

    .slider-container { display: flex; align-items: center; gap: 10px; }
    .slider-container input { flex: 1; accent-color: #6366f1; }
    .slider-val { font-size: 0.8rem; width: 35px; color: #a5b4fc; }

    .info-card { background: #0b0f19; border-left: 4px solid #6366f1; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; border-left-width: 4px; }
    .info-card h3 { font-size: 1rem; margin-bottom: 4px; color: #a5b4fc; }
    .info-card p { font-size: 0.82rem; line-height: 1.45; color: #cbd5e1; margin-bottom: 4px; }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 0.72rem; font-weight: bold; }
    .badge-normal { background: #065f46; color: #34d399; }
    .badge-abnormal { background: #7f1d1d; color: #f87171; }

    .view-btns { display: flex; gap: 6px; }
    .view-btns button { flex: 1; background: #1f2937; border: 1px solid #374151; color: #e2e8f0; padding: 8px 4px; border-radius: 6px; cursor: pointer; font-size: 0.78rem; }
    .view-btns button:active { background: #4f46e5; }

    .legend-box { background: #0b0f19; border-radius: 8px; padding: 10px; font-size: 0.75rem; color: #94a3b8; display: flex; flex-direction: column; gap: 5px; border: 1px solid #1e293b; }
    .color-chip { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

    /* 모바일 반응형 (화면 폭 768px 이하) */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      #canvas-container { height: 100%; }

      #sidebar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        max-height: 80vh;
        border-left: none;
        border-top: 1px solid #374151;
        border-radius: 16px 16px 0 0;
        padding: 12px 18px 24px 18px;
        box-shadow: 0 -8px 25px rgba(0,0,0,0.8);
        transform: translateY(calc(100% - 64px)); /* 기본은 접힘 상태 */
      }

      #sidebar.expanded {
        transform: translateY(0);
      }

      .sheet-handle { display: flex; }
      h2 { font-size: 1.05rem; }
      .header-sub { display: none; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="sidebar">
    <!-- 모바일 드래그/클릭 핸들 -->
    <div class="sheet-handle" id="sheetHandle">
      <div class="sheet-handle-bar"></div>
    </div>

    <h2>
      <span id="titleText">수의산과 3D 시각화</span>
      <span class="header-sub" style="font-size: 0.75rem; color: #818cf8; font-weight: normal;">터치 조작 지원</span>
    </h2>

    <div class="control-group">
      <label>1. 태위 (Presentation)</label>
      <select id="presentation">
        <option value="anterior">세로·머리태위 (종위·두위 - 앞다리 진입)</option>
        <option value="posterior">세로·꼬리태위 (종위·미위 - 뒷다리 진입)</option>
        <option value="transverse">가로태위 (횡위)</option>
      </select>
    </div>

    <div class="control-group">
      <label>2. 태향 (Position)</label>
      <select id="position">
        <option value="dorsal">위쪽태향 (상태향/배천골 - 등 위쪽)</option>
        <option value="ventral">아래쪽태향 (하태향/배치골 - 등 아래쪽)</option>
        <option value="rightLateral">오른쪽 옆태향 (우배·장골)</option>
        <option value="leftLateral">왼쪽 옆태향 (좌배·장골)</option>
      </select>
    </div>

    <div class="control-group">
      <label>3. 태세 (Posture - 다리 및 머리)</label>
      <select id="posture">
        <option value="normal">정상 태세 (사지 및 머리 전방 신전)</option>
        <option value="headLateral">머리 옆쪽 굴곡 (측두위)</option>
        <option value="headVentral">머리 가슴쪽 하방 굴곡 (두정위/흉두위)</option>
        <option value="carpalFlexionUni">한쪽 앞무릎(완관절) 굴곡위</option>
        <option value="carpalFlexionBi">양쪽 앞무릎(완관절) 굴곡위</option>
        <option value="shoulderFlexion">어깨(견갑골) 굴곡위 (다리가 몸 밑으로)</option>
        <option value="breech">엉덩관절(고관절) 굴곡위 (둔위)</option>
        <option value="hockFlexion">뒷발목(비절) 굴곡위</option>
        <option value="dogSitting">견좌자세 (양 뒷다리 전방 신장)</option>
      </select>
    </div>

    <div class="control-group">
      <label>어미소 투시 투명도 조절</label>
      <div class="slider-container">
        <input type="range" id="damOpacity" min="0.05" max="0.8" step="0.05" value="0.22">
        <span id="opacityVal" class="slider-val">22%</span>
      </div>
    </div>

    <div class="control-group">
      <label>관찰 시점 프리셋</label>
      <div class="view-btns">
        <button onclick="setView(0, 2.2, 6.2)">산도 직후방</button>
        <button onclick="setView(6.8, 2.2, 0)">우측면 투시</button>
        <button onclick="setView(0, 8.5, 0.1)">상단 천골면</button>
      </div>
    </div>

    <div class="info-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <h3 id="info-title">정상 분만 자세</h3>
        <span id="info-badge" class="badge badge-normal">정상</span>
      </div>
      <p id="info-desc">양 앞다리가 모체 출산길 쪽으로 뻗어 있고 머리가 앞다리 위에 놓여 있습니다.</p>
      <p><strong>처치:</strong> <span id="info-treatment">자연 분만 관찰 및 보조</span></p>
    </div>

    <div class="legend-box">
      <div><span class="color-chip" style="background:#ef4444;"></span><b>적색 림(Ring)</b>: 골반강 출구 (천골·치골 경계면)</div>
      <div><span class="color-chip" style="background:#f59e0b;"></span><b>황색 봉</b>: 송아지 등뼈(척추, 태향 판단선)</div>
      <div><span class="color-chip" style="background:#f97316;"></span><b>주황색 구</b>: 앞무릎(완관절) / 뒷발목(비절)</div>
      <div><span class="color-chip" style="background:#10b981;"></span><b>녹색 블록</b>: 송아지 발굽(구절 부위)</div>
    </div>
  </div>

  <script>
    // --- 1. Three.js 기본 씬 셋업 ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    // 화면 폭에 따른 초기 카메라 거리 조절
    const isMobileInit = window.innerWidth <= 768;
    camera.position.set(isMobileInit ? 5.5 : 4.8, isMobileInit ? 3.8 : 3.2, isMobileInit ? 7.2 : 5.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 모바일 고해상도 최적화
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.8, 0);

    // 모바일 터치 대응 (1손가락 회전, 2손가락 줌/패닝)
    controls.touches = {
      ONE: THREE.TOUCH.ROTATE,
      TWO: THREE.TOUCH.DOLLY_PAN
    };

    // 조명 세팅
    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.85);
    keyLight.position.set(6, 12, 8);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x818cf8, 0.5);
    rimLight.position.set(-6, 5, -6);
    scene.add(rimLight);

    const grid = new THREE.GridHelper(12, 24, 0x1e293b, 0x0f172a);
    scene.add(grid);

    // --- 2. 엄마소 해부학적 모델 생성 ---
    const damGroup = new THREE.Group();
    scene.add(damGroup);

    const cowTransMat = new THREE.MeshStandardMaterial({
      color: 0x64748b,
      transparent: true,
      opacity: 0.22,
      depthWrite: false,
      roughness: 0.4,
      metalness: 0.1
    });

    const cowWireMat = new THREE.MeshBasicMaterial({
      color: 0x94a3b8,
      wireframe: true,
      transparent: true,
      opacity: 0.15
    });

    const cowBoneSolidMat = new THREE.MeshStandardMaterial({ color: 0xcfd8dc, roughness: 0.5 });
    const udderMat = new THREE.MeshStandardMaterial({ color: 0xf472b6, transparent: true, opacity: 0.35 });

    function addPart(geo, pos, rot, mat = cowTransMat, wire = true) {
      const mesh = new THREE.Mesh(geo, mat);
      if (pos) mesh.position.set(...pos);
      if (rot) mesh.rotation.set(...rot);
      damGroup.add(mesh);

      if (wire) {
        const wMesh = new THREE.Mesh(geo, cowWireMat);
        if (pos) wMesh.position.set(...pos);
        if (rot) wMesh.rotation.set(...rot);
        damGroup.add(wMesh);
      }
      return mesh;
    }

    // 흉곽 & 복부 & 엉덩이
    const thoraxGeo = new THREE.SphereGeometry(1.4, 20, 16);
    thoraxGeo.scale(0.85, 1.15, 1.4);
    addPart(thoraxGeo, [0, 2.0, -1.2]);

    const abdomenGeo = new THREE.SphereGeometry(1.55, 20, 16);
    abdomenGeo.scale(0.95, 1.1, 1.3);
    addPart(abdomenGeo, [0, 1.85, 0.3]);

    const rumpGeo = new THREE.CylinderGeometry(1.3, 1.45, 1.6, 18);
    rumpGeo.scale(0.88, 1.0, 1.0);
    addPart(rumpGeo, [0, 2.15, 1.35], [Math.PI / 2.2, 0, 0]);

    // 척추 능선
    const spineRidge = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.14, 4.8), cowBoneSolidMat);
    spineRidge.position.set(0, 3.25, -0.6);
    damGroup.add(spineRidge);

    // 머리/목/뿔/귀
    const headGroup = new THREE.Group();
    headGroup.position.set(0, 2.7, -3.2);
    headGroup.add(addPart(new THREE.BoxGeometry(0.85, 0.6, 0.8), [0, 0.3, 0], [-0.3, 0, 0], cowTransMat, false));
    headGroup.add(addPart(new THREE.CylinderGeometry(0.3, 0.42, 0.9, 12), [0, -0.2, -0.6], [Math.PI / 3, 0, 0], cowTransMat, false));

    function createHorn(isLeft) {
      const side = isLeft ? 1 : -1;
      const horn = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.65, 10), cowBoneSolidMat);
      horn.position.set(side * 0.55, 0.65, -0.1);
      horn.rotation.set(0.2, 0, -side * (Math.PI / 3.2));
      return horn;
    }
    headGroup.add(createHorn(true));
    headGroup.add(createHorn(false));

    addPart(new THREE.CylinderGeometry(0.65, 0.95, 1.8, 14), [0, 2.35, -2.3], [Math.PI / 3.8, 0, 0]);
    damGroup.add(headGroup);

    // 유방 & 꼬리
    const udder = addPart(new THREE.SphereGeometry(0.45, 14, 10), [0, 1.05, 0.9], [0, 0, 0], udderMat, false);
    udder.scale.set(0.9, 0.7, 1.2);

    const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.04, 1.6, 8), cowBoneSolidMat);
    tail.position.set(0, 1.8, 2.3);
    tail.rotation.x = -0.25;
    damGroup.add(tail);

    // 4다리
    function createLeg(x, z, isHind) {
      const leg = new THREE.Group();
      leg.position.set(x, 0, z);
      leg.add(addPart(new THREE.CylinderGeometry(isHind ? 0.32 : 0.28, 0.2, 1.1, 10), [0, 1.5, 0], [isHind ? -0.1 : 0.1, 0, 0], cowTransMat, false));
      const joint = new THREE.Mesh(new THREE.SphereGeometry(0.18, 10, 10), cowBoneSolidMat);
      joint.position.set(0, 0.95, isHind ? -0.05 : 0);
      leg.add(joint);
      leg.add(addPart(new THREE.CylinderGeometry(0.16, 0.13, 0.9, 10), [0, 0.5, 0], [0, 0, 0], cowTransMat, false));
      const hoof = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.14, 0.32), cowBoneSolidMat);
      hoof.position.set(0, 0.07, 0.05);
      leg.add(hoof);
      damGroup.add(leg);
    }
    createLeg(0.9, -1.8, false);
    createLeg(-0.9, -1.8, false);
    createLeg(0.95, 1.3, true);
    createLeg(-0.95, 1.3, true);

    // 산과 림 (Pelvic Brim)
    const pelvicBrim = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.045, 16, 48), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
    pelvicBrim.position.set(0, 2.05, 1.85);
    damGroup.add(pelvicBrim);

    const sacrumMarker = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.08, 0.08), new THREE.MeshBasicMaterial({ color: 0xf87171 }));
    sacrumMarker.position.set(0, 3.25, 1.85);
    damGroup.add(sacrumMarker);

    // --- 3. 송아지 모델 조립 ---
    const fetusPivot = new THREE.Group();
    fetusPivot.position.set(0, 2.05, 0.9);
    scene.add(fetusPivot);

    const fRoot = new THREE.Group();
    fetusPivot.add(fRoot);

    const calfSkinMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.5 });
    const calfSpineMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
    const legBoneMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1 });
    const jointMat = new THREE.MeshStandardMaterial({ color: 0xf97316 });
    const hoofMat = new THREE.MeshStandardMaterial({ color: 0x10b981 });

    const fBody = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.35, 1.35, 14), calfSkinMat);
    fBody.rotation.x = Math.PI / 2;
    fRoot.add(fBody);

    const fSpine = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 1.3), calfSpineMat);
    fSpine.position.set(0, 0.38, 0);
    fRoot.add(fSpine);

    const neckPivot = new THREE.Group();
    neckPivot.position.set(0, 0.1, 0.65);
    fRoot.add(neckPivot);

    const fHead = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.6, 14), calfSkinMat);
    fHead.rotation.x = Math.PI / 2;
    fHead.position.set(0, 0, 0.3);
    neckPivot.add(fHead);

    function buildForeleg(isLeft) {
      const side = isLeft ? 1 : -1;
      const shoulder = new THREE.Group();
      shoulder.position.set(side * 0.32, -0.15, 0.55);
      fRoot.add(shoulder);

      const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.065, 0.45), legBoneMat);
      upperArm.position.set(0, -0.22, 0);
      shoulder.add(upperArm);

      const carpus = new THREE.Group();
      carpus.position.set(0, -0.45, 0);
      shoulder.add(carpus);

      const kneeBall = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 10), jointMat);
      carpus.add(kneeBall);

      const lowerArm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.55), legBoneMat);
      lowerArm.position.set(0, 0, 0.28);
      lowerArm.rotation.x = Math.PI / 2;
      carpus.add(lowerArm);

      const hoof = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.12), hoofMat);
      hoof.position.set(0, 0, 0.58);
      carpus.add(hoof);

      return { shoulder, carpus };
    }

    function buildHindleg(isLeft) {
      const side = isLeft ? 1 : -1;
      const hip = new THREE.Group();
      hip.position.set(side * 0.32, -0.12, -0.55);
      fRoot.add(hip);

      const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.07, 0.5), legBoneMat);
      thigh.position.set(0, -0.25, 0);
      hip.add(thigh);

      const hock = new THREE.Group();
      hock.position.set(0, -0.5, 0);
      hip.add(hock);

      const hockBall = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 10), jointMat);
      hock.add(hockBall);

      const lowerLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.055, 0.6), legBoneMat);
      lowerLeg.position.set(0, 0, -0.3);
      lowerLeg.rotation.x = -Math.PI / 2;
      hock.add(lowerLeg);

      const hoof = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.12), hoofMat);
      hoof.position.set(0, 0, -0.62);
      hock.add(hoof);

      return { hip, hock };
    }

    const foreLeft = buildForeleg(true);
    const foreRight = buildForeleg(false);
    const hindLeft = buildHindleg(true);
    const hindRight = buildHindleg(false);

    // --- 4. 시뮬레이션 제어 로직 ---
    const selPres = document.getElementById('presentation');
    const selPos = document.getElementById('position');
    const selPost = document.getElementById('posture');

    const infoTitle = document.getElementById('info-title');
    const infoBadge = document.getElementById('info-badge');
    const infoDesc = document.getElementById('info-desc');
    const infoTreat = document.getElementById('info-treatment');

    function updateSimulation() {
      const pres = selPres.value;
      const pos = selPos.value;
      const post = selPost.value;

      fRoot.rotation.set(0, 0, 0);
      if (pres === 'anterior') fRoot.rotation.y = 0;
      else if (pres === 'posterior') fRoot.rotation.y = Math.PI;
      else if (pres === 'transverse') fRoot.rotation.y = Math.PI / 2;

      let rollAngle = 0;
      if (pos === 'dorsal') rollAngle = 0;
      else if (pos === 'ventral') rollAngle = Math.PI;
      else if (pos === 'rightLateral') rollAngle = Math.PI / 2;
      else if (pos === 'leftLateral') rollAngle = -Math.PI / 2;
      fRoot.rotateZ(rollAngle);

      neckPivot.rotation.set(0, 0, 0);
      foreLeft.shoulder.rotation.set(0, 0, 0);
      foreLeft.carpus.rotation.set(0, 0, 0);
      foreRight.shoulder.rotation.set(0, 0, 0);
      foreRight.carpus.rotation.set(0, 0, 0);
      hindLeft.hip.rotation.set(0, 0, 0);
      hindLeft.hock.rotation.set(0, 0, 0);
      hindRight.hip.rotation.set(0, 0, 0);
      hindRight.hock.rotation.set(0, 0, 0);

      switch (post) {
        case 'headLateral': neckPivot.rotation.y = -Math.PI / 2.1; break;
        case 'headVentral': neckPivot.rotation.x = Math.PI / 2.2; break;
        case 'carpalFlexionUni': foreRight.carpus.rotation.x = -Math.PI / 1.7; break;
        case 'carpalFlexionBi':
          foreLeft.carpus.rotation.x = -Math.PI / 1.7;
          foreRight.carpus.rotation.x = -Math.PI / 1.7;
          break;
        case 'shoulderFlexion': foreRight.shoulder.rotation.x = -Math.PI / 2.0; break;
        case 'breech':
          hindLeft.hip.rotation.x = Math.PI / 1.8;
          hindRight.hip.rotation.x = Math.PI / 1.8;
          break;
        case 'hockFlexion': hindRight.hock.rotation.x = Math.PI / 1.8; break;
        case 'dogSitting':
          hindLeft.hip.rotation.x = Math.PI / 1.7;
          hindRight.hip.rotation.x = Math.PI / 1.7;
          hindLeft.hock.rotation.x = -Math.PI / 2.2;
          hindRight.hock.rotation.x = -Math.PI / 2.2;
          break;
      }

      const isNormal = (pres === 'anterior' && pos === 'dorsal' && post === 'normal');
      if (isNormal) {
        infoBadge.className = 'badge badge-normal';
        infoBadge.innerText = '정상 분만';
        infoTitle.innerText = '정상 종위·두위 상태향';
        infoDesc.innerText = '어미소 골반 입구(빨간 링)로 양 앞다리와 머리가 먼저 통과하는 최적의 자세입니다.';
        infoTreat.innerText = '자연 분만 관찰 및 유도';
      } else {
        infoBadge.className = 'badge badge-abnormal';
        infoBadge.innerText = '난산 (Dystocia)';
        infoTitle.innerText = `${selPres.options[selPres.selectedIndex].text} / ${selPost.options[selPost.selectedIndex].text}`;
        
        if (post.includes('carpal')) {
          infoDesc.innerText = '완관절(주황색 구)이 꺾여 골반 치골 턱에 걸려 배출이 정체됩니다.';
          infoTreat.innerText = '태아 반발(자궁 안으로 밈) 후 발목을 들어올려 산도 방향으로 신전';
        } else if (post === 'breech') {
          infoDesc.innerText = '꼬리태위에서 뒷다리가 배 밑으로 접혀 엉덩이만 골반 림에 걸린 완전 둔위입니다.';
          infoTreat.innerText = '손을 깊숙이 넣어 비절을 외측 회전시키며 발목을 산도로 단계적 정복';
        } else if (post === 'shoulderFlexion') {
          infoDesc.innerText = '한쪽 앞다리가 몸 밑으로 들어가 어깨만 걸려 진입이 멈춘 상태입니다.';
          infoTreat.innerText = '태아 반발 후 완관절을 먼저 유도하고 발목을 단계적으로 산도로 신전';
        } else {
          infoDesc.innerText = '골반 통과 직경을 초과하여 배출이 정체됩니다.';
          infoTreat.innerText = '산과적 정복술(Mutation: 반발·회전·신전) 시행';
        }
      }
    }

    [selPres, selPos, selPost].forEach(el => el.addEventListener('change', updateSimulation));
    updateSimulation();

    // 투명도 슬라이더
    const opSlider = document.getElementById('damOpacity');
    const opText = document.getElementById('opacityVal');
    opSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      cowTransMat.opacity = val;
      opText.innerText = Math.round(val * 100) + '%';
    });

    // 카메라 프리셋
    window.setView = function(x, y, z) {
      const isMobile = window.innerWidth <= 768;
      const mult = isMobile ? 1.25 : 1.0;
      camera.position.set(x * mult, y * mult, z * mult);
      controls.target.set(0, 1.8, 0);
    };

    // --- 5. 모바일 바텀시트 터치/토글 인터랙션 ---
    const sidebar = document.getElementById('sidebar');
    const sheetHandle = document.getElementById('sheetHandle');
    let startY = 0;
    let currentY = 0;

    sheetHandle.addEventListener('click', () => {
      sidebar.classList.toggle('expanded');
    });

    sheetHandle.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
    }, { passive: true });

    sheetHandle.addEventListener('touchmove', (e) => {
      currentY = e.touches[0].clientY;
      const diff = currentY - startY;
      if (diff > 40) sidebar.classList.remove('expanded');
      else if (diff < -40) sidebar.classList.add('expanded');
    }, { passive: true });

    // 3D 캔버스 터치 시 바텀시트 자동으로 내려주기
    container.addEventListener('touchstart', () => {
      if (window.innerWidth <= 768 && sidebar.classList.contains('expanded')) {
        sidebar.classList.remove('expanded');
      }
    }, { passive: true });

    // 화면 리사이즈/회전 대응
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
